# Development profile - connects to local Docker PostgreSQL
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/scorehub
    username: scorehub
    password: scorehub_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Flyway uses the same datasource by default
  flyway:
    baseline-on-migrate: true

# More verbose logging for development
logging:
  level:
    com.scorehub: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

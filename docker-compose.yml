services:
  postgres:
    image: postgres:16-alpine
    container_name: scorehub-db
    environment:
      POSTGRES_DB: scorehub
      POSTGRES_USER: scorehub
      POSTGRES_PASSWORD: scorehub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorehub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
